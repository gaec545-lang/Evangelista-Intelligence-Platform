<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b89a42" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d4b762" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3e4d32" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4f6140" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1000" height="1000" fill="#12120f" />
  
  <!-- Swirling elegant lines -->
  <g fill="none" stroke-linecap="round">
    <!-- Gold swirls -->
    <path d="M-100,500 C200,200 400,800 1100,300" stroke="url(#grad1)" stroke-width="4" opacity="0.6"/>
    <path d="M-50,600 C300,100 500,900 1150,400" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
    <path d="M100,-100 C300,300 100,800 800,1100" stroke="url(#grad1)" stroke-width="3" opacity="0.5"/>
    <path d="M200,-50 C400,400 0,900 900,1150" stroke="url(#grad1)" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Olive swirls -->
    <path d="M-100,200 C300,600 600,-100 1100,700" stroke="url(#grad2)" stroke-width="5" opacity="0.5"/>
    <path d="M0,100 C400,500 700,-200 1200,800" stroke="url(#grad2)" stroke-width="2" opacity="0.3"/>
    <path d="M900,-100 C600,400 1100,700 200,1100" stroke="url(#grad2)" stroke-width="3" opacity="0.4"/>
    <path d="M1000,0 C700,500 1200,800 300,1200" stroke="url(#grad2)" stroke-width="1" opacity="0.2"/>

    <!-- Subtle accents -->
    <circle cx="250" cy="400" r="150" stroke="#b89a42" stroke-width="0.5" opacity="0.15" />
    <circle cx="750" cy="600" r="250" stroke="#3e4d32" stroke-width="0.5" opacity="0.15" />
    <circle cx="500" cy="500" r="350" stroke="#d4b762" stroke-width="0.5" opacity="0.1" />
  </g>
</svg>
