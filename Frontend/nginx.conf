server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://app-evangelista-backend.jollyflower-774ba306.eastus2.azurecontainerapps.io/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host app-evangelista-backend.jollyflower-774ba306.eastus2.azurecontainerapps.io;
        proxy_cache_bypass $http_upgrade;
    }

    location /health {
        proxy_pass https://app-evangelista-backend.jollyflower-774ba306.eastus2.azurecontainerapps.io/health;
        proxy_set_header Host app-evangelista-backend.jollyflower-774ba306.eastus2.azurecontainerapps.io;
    }

    location /readiness {
        proxy_pass https://app-evangelista-backend.jollyflower-774ba306.eastus2.azurecontainerapps.io/readiness;
        proxy_set_header Host app-evangelista-backend.jollyflower-774ba306.eastus2.azurecontainerapps.io;
    }

}
