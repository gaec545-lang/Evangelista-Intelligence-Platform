_format_version: "1.1"

plugins:
  - name: cors
    config:
      origins:
        - https://plataforma.evangelistaco.com
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Authorization
        - Content-Type
        - Accept
        - x-supabase-api-version
        - x-client-info
        - apikey
        - Prefer
        - Range
        - accept-profile
        - content-profile
        - x-upsert
      exposed_headers:
        - Content-Range
        - X-Total-Count
        - X-PostgREST-Version
      credentials: true
      max_age: 86400

services:
  - name: auth
    url: http://ca-gotrue/
    routes:
      - name: auth
        paths:
          - /auth/v1/
          - /auth/v1
        strip_path: true
  - name: rest
    url: http://ca-postgrest/
    routes:
      - name: rest
        paths:
          - /rest/v1/
          - /rest/v1
        strip_path: true
